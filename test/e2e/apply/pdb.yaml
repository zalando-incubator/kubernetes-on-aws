apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: "{{{APPLICATION}}}-{{{COMPONENT}}}"
  labels:
    application: "{{{APPLICATION}}}"
    component: "{{{COMPONENT}}}"
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      application: "{{{APPLICATION}}}"
      component: "{{{COMPONENT}}}"
