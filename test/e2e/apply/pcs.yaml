apiVersion: zalando.org/v1
kind: PlatformCredentialsSet
metadata:
  name: "{{{APPLICATION}}}-{{{COMPONENT}}}-credentials"
  labels:
    application: "{{{APPLICATION}}}"
    component: "{{{COMPONENT}}}"
spec:
  application: "{{{APPLICATION}}}"
  token_version: "v2"
  tokens:
    cluster:
      privileges: []
