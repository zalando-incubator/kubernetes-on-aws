{{ if eq .Cluster.ConfigItems.sandbox_controller_enabled "true" }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxes.zalando.org
spec:
  group: zalando.org
  names:
    kind: Sandbox
    plural: sandboxes
    singular: sandbox
    shortNames:
      - sb
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - testContext
                - sourceHosts
                - target
              properties:
                testContext:
                  description: |-
                    Specifies the value used to identify requests that can be routed to the sandbox target.
                    The format of the incoming `X-Zalando-Client-Id` header should be: `test:$testContext:.*`.
                  type: string
                sourceHosts:
                  description: Traffic to these hosts will be rerouted to the targetHost if testContext matches.
                  type: array
                  items:
                    type: string
                target:
                  description: The target host of the sandboxed traffic.
                  type: string
{{ end }}
