{{ if eq .Cluster.ConfigItems.sandbox_controller_enabled "true" }}

apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-controller
  namespace: kube-system
  labels:
    application: sandbox-controller
    component: sandbox-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sandbox-controller
  labels:
    application: sandbox-controller
    component: sandbox-controller
rules:
  - apiGroups:
      - zalando.org
    resources:
      - sandboxes
      - sandboxegresses
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - zalando.org
    resources:
      - routegroups
    verbs:
      - list
      - watch
      - get
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - zalando.org
    resources:
      - stacks
    verbs:
      - list
      - get
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - list
      - watch
      - get
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - list
      - watch
      - get
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sandbox-controller
  labels:
    application: sandbox-controller
    component: sandbox-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sandbox-controller
subjects:
  - kind: ServiceAccount
    name: sandbox-controller
    namespace: kube-system
{{ end }}
