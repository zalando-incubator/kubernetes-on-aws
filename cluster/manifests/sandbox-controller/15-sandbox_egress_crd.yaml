{{ if eq .Cluster.ConfigItems.sandbox_controller_enabled "true" }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: sandboxegresses.zalando.org
spec:
  group: zalando.org
  names:
    categories:
    - all
    kind: SandboxEgress
    listKind: SandboxEgressList
    plural: sandboxegresses
    shortNames:
    - sbe
    singular: sandboxegress
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              routes:
                description: A list of routes for which requests should be intercepted
                  by Egress and either mocked or forwarded to the test host.
                items:
                  properties:
                    host:
                      description: The hostname for which requests should be intercepted.
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      type: string
                    hostRoutes:
                      description: Routes at host whose requests should be intercepted.
                      items:
                        properties:
                          path:
                            description: The path for which requests should be intercepted.
                            pattern: ^/.*
                            type: string
                          pathRoutes:
                            description: Routes at path whose requests should be intercepted.
                            items:
                              properties:
                                endpointRoute:
                                  description: EndpointRoute defines how sandboxed
                                    requests to this endpoint should be handled.
                                  properties:
                                    body:
                                      description: If body is set, requests to this
                                        endpoint will be mocked with the provided
                                        body and status code.
                                      type: string
                                    filters:
                                      description: Filters specifies the list of skipper
                                        filters applied to the request before forwarding
                                        to the target.
                                      items:
                                        type: string
                                      maxItems: 100
                                      minItems: 1
                                      type: array
                                    status:
                                      description: HTTP status code to return in mocked
                                        responses.
                                      maximum: 599
                                      minimum: 100
                                      type: integer
                                    targetHost:
                                      description: If target is set, requests to this
                                        endpoint will be forwarded to the provided
                                        target host.
                                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?([.][a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                                      type: string
                                  type: object
                                  x-kubernetes-validations:
                                  - message: exactly one of the fields in [body targetHost]
                                      must be set
                                    rule: '[has(self.body),has(self.targetHost)].filter(x,x==true).size()
                                      == 1'
                                  - message: exactly one of the fields in [body filters]
                                      must be set
                                    rule: '[has(self.body),has(self.filters)].filter(x,x==true).size()
                                      == 1'
                                  - message: exactly one of the fields in [status
                                      targetHost] must be set
                                    rule: '[has(self.status),has(self.targetHost)].filter(x,x==true).size()
                                      == 1'
                                  - message: exactly one of the fields in [status
                                      filters] must be set
                                    rule: '[has(self.status),has(self.filters)].filter(x,x==true).size()
                                      == 1'
                                methods:
                                  description: Methods defines valid HTTP methods
                                    for the specified endpoint route.
                                  items:
                                    description: HTTPMethod is a valid HTTP method
                                      in uppercase.
                                    enum:
                                    - GET
                                    - HEAD
                                    - POST
                                    - PUT
                                    - PATCH
                                    - DELETE
                                    - CONNECT
                                    - OPTIONS
                                    - TRACE
                                    type: string
                                  maxItems: 10
                                  minItems: 1
                                  type: array
                                  x-kubernetes-list-type: set
                              required:
                              - endpointRoute
                              - methods
                              type: object
                            maxItems: 50
                            minItems: 1
                            type: array
                        required:
                        - path
                        - pathRoutes
                        type: object
                      maxItems: 50
                      minItems: 1
                      type: array
                  required:
                  - host
                  - hostRoutes
                  type: object
                maxItems: 50
                minItems: 1
                type: array
              stackRef:
                description: StackRef is the name of the Stack that owns this egress
                  and whose pods should receive the egress annotation.
                type: string
              testProject:
                description: |-
                  Specifies the value used to identify requests that can be altered while proxying through egress sidecar.
                  The format of the header `X-Zalando-Client-Id` of the incoming requests  should be: `test:$testProject:.*`.
                type: string
            required:
            - routes
            - stackRef
            - testProject
            type: object
            x-kubernetes-validations:
            - message: stackRef is immutable
              rule: self.stackRef == oldSelf.stackRef
          status:
            description: |-
              SandboxEgressStatus is the current state of the EgressSandbox.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#spec-and-status
            properties:
              problems:
                items:
                  type: string
                type: array
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
{{ end }}
