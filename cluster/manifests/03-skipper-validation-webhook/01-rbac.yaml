apiVersion: v1
kind: ServiceAccount
metadata:
  name: skipper-validation-webhook
  namespace: kube-system
  labels:
    application: skipper-ingress
    component: webhook
# {{ if eq .Cluster.ConfigItems.skipper_open_policy_agent_enabled "true" }}
  # Note: if the role extends beyond OPA use, this condition can be removed
  annotations:
    # {{- if eq .Cluster.Provider "zalando-eks" }}
    eks.amazonaws.com/role-arn: "arn:aws:iam::{{.Cluster.InfrastructureAccountID}}:role/{{ .Cluster.LocalID }}-app-skipper-validation-webhook"
    # {{- else}}
    iam.amazonaws.com/role: "{{ .Cluster.LocalID }}-app-skipper-validation-webhook"
    # {{- end}}
# {{ end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: skipper-validation-webhook
rules:
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - get
  - list
- apiGroups: [""]
  resources: ["namespaces", "services", "endpoints", "pods"]
  verbs: ["get", "list"]
- apiGroups:
    - discovery.k8s.io
  resources:
    - endpointslices
  verbs:
    - get
    - list
- apiGroups:
  - zalando.org
  resources:
  - routegroups
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: skipper-validation-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: skipper-validation-webhook
subjects:
- kind: ServiceAccount
  name: skipper-validation-webhook
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: skipper-validation-webhook-privileged-psp
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: privileged-psp
subjects:
- kind: ServiceAccount
  name: skipper-validation-webhook
  namespace: kube-system

