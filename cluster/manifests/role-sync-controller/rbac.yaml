{{ if eq .Cluster.ConfigItems.role_sync_controller_enabled "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: role-sync-controller
  labels:
    application: kubernetes
    component: role-sync-controller
rules:
  # Allow the controller to list namespaces
  - apiGroups:
    - ""
    resources:
    - "namespaces"
    verbs:
    - "list"
  # Allow the controller to manage Roles and Rolebindings
  - apiGroups:
    - rbac.authorization.k8s.io
    resources:
    - roles
    - rolebindings
    verbs:
    - "get"
    - "create"
    - "update"
  # Allow the controller to list clusterrolebindings
  - apiGroups:
    - rbac.authorization.k8s.io
    resources:
    - "clusterrolebindings"
    - "clusterroles"
    verbs:
    - "list"
  # Allow the controller to manage roles based on reading Secrets
  - apiGroups:
    - ""
    resources:
    - secrets
    verbs:
    - "get"
    - "list"
    - "watch"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: role-sync-controller
  labels:
    application: kubernetes
    component: role-sync-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: role-sync-controller
subjects:
- kind: ServiceAccount
  name: role-sync-controller
  namespace: kube-system
{{ end }}
