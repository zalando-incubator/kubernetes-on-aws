{{- if eq .Cluster.ConfigItems.karpenter_drift_disruption_enabled "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-disruption-controller
  namespace: kube-system
  labels:
    application: kubernetes
    component: workload-disruption-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      deployment: workload-disruption-controller
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        application: kubernetes
        component: workload-disruption-controller
        deployment: workload-disruption-controller
      annotations:
        logging/destination: "{{.Cluster.ConfigItems.log_destination_both}}"
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      serviceAccountName: workload-disruption-controller
      containers:
      - name: workload-disruption-controller
        image: container-registry.zalando.net/cloud-platform/workload-disruption-controller:main-2
        args:
            - --num-workers={{.Cluster.ConfigItems.workload_disruption_controller_num_workers}}
            - --resync-period={{.Cluster.ConfigItems.workload_disruption_controller_resync_period}}
            - --force-eviction-grace-period={{.Cluster.ConfigItems.drain_grace_period}}
            - --min-pod-lifetime={{.Cluster.ConfigItems.drain_min_pod_lifetime}}
            - --force-eviction-min-healthy-sibling-lifetime={{.Cluster.ConfigItems.drain_min_healthy_sibling_lifetime}}
            - --force-eviction-min-unhealthy-sibling-lifetime={{.Cluster.ConfigItems.drain_min_unhealthy_sibling_lifetime}}
            - --force-eviction-interval={{.Cluster.ConfigItems.drain_force_evict_interval}}
            - --stuck-pod-min-age={{.Cluster.ConfigItems.workload_disruption_controller_stuck_pod_min_age}}
{{- range split .Cluster.ConfigItems.workload_disruption_controller_force_eviction_exclude_pod_labels ";"}}
{{- if ne . ""}}
            - --force-eviction-exclude-pod-label={{.}}
{{- end}}
{{- end}}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9090
        resources:
          limits:
            cpu: {{.Cluster.ConfigItems.workload_disruption_controller_cpu}}
            memory: {{.Cluster.ConfigItems.workload_disruption_controller_memory}}
          requests:
            cpu: {{.Cluster.ConfigItems.workload_disruption_controller_cpu}}
            memory: {{.Cluster.ConfigItems.workload_disruption_controller_memory}}
{{- if eq .Cluster.Provider "zalando-eks"}}
      tolerations:
      - key: dedicated
        value: cluster-seed
        effect: NoSchedule
      - key: node.kubernetes.io/not-ready
        operator: Exists
{{- else}}
      tolerations:
      - key: node.kubernetes.io/role
        value: master
        effect: NoSchedule
      - key: node.kubernetes.io/not-ready
        operator: Exists
{{- end}}
{{- end}}
