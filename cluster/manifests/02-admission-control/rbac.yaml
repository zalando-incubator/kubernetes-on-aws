apiVersion: v1
kind: ServiceAccount
metadata:
  name: admission-controller
  namespace: kube-system
  labels:
    application: kubernetes
    component: admission-controller
{{- if eq .Cluster.ConfigItems.opa_admission_enabled "true" }}
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::{{.Cluster.InfrastructureAccountID}}:role/{{ .Cluster.LocalID }}-app-admission-controller"
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admission-controller
  labels:
    application: kubernetes
    component: admission-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin # TODO: consider limiting this.
subjects:
  - kind: ServiceAccount
    name: admission-controller
    namespace: kube-system
