{{- if and (eq .Cluster.Provider "zalando-eks") (eq .Cluster.ConfigItems.opa_admission_enabled "true") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: aaas-opa-config
  namespace: kube-system
  labels:
    application: kubernetes
    component: admission-controller
data:
  opaconfig.yaml: |-
    default_decision: /system/main/main
{{- if eq .Cluster.ConfigItems.opa_admission_direct_bundle_enabled "true" }}
    # Scratch-cluster bundle delivery uses its own S3 test bucket.
    services:
    - credentials:
        s3_signing:
          web_identity_credentials:
            aws_region: {{ .Cluster.Region }}
            session_name: open-policy-agent-instance
      name: test-bucket
      url: "{{ .Cluster.ConfigItems.opa_admission_direct_bundle_service_url }}"
    bundles:
      kubernetes-admission:
        service: test-bucket
        resource: "{{ .Cluster.ConfigItems.opa_admission_direct_bundle_resource }}"
        polling:
          min_delay_seconds: 10
          max_delay_seconds: 20
{{- else }}
    # Policy discovery and service-level bundle loading use the established Styra config.
    discovery:
      name: discovery
      resource: v2/bundles/zalando-apps/{{ .Cluster.ConfigItems.opa_admission_bundle_name }}/discovery.tgz
      service: styra-bundles
    services:
    - credentials:
        s3_signing:
          web_identity_credentials:
            aws_region: {{ .Cluster.Region }}
            session_name: open-policy-agent-instance
      name: styra-bundles
      url: "{{ .Cluster.ConfigItems.skipper_open_policy_agent_bundles_url }}"
{{- end }}
    labels:
      environment: production
      kubernetes-cluster-alias: {{ .Cluster.Alias }}
      aws-account-id: "{{ .Cluster.InfrastructureAccountID }}"
{{- if eq .Cluster.ConfigItems.opa_admission_decision_log_export_enabled "true" }}
    # Decision logging is disabled by omission unless explicitly enabled.
    decision_logs:
      plugin: eopa_dl
    plugins:
      eopa_dl:
        buffer:
          type: event
          max_bytes: 15728640
          flush_at_bytes: 10485760
          flush_at_period: 15s
        output:
        - type: s3
          bucket: {{ .Cluster.ConfigItems.opa_admission_bundle_name }}
          timeout: 2s
          endpoint: "{{ .Cluster.ConfigItems.skipper_open_policy_agent_decision_log_s3_endpoint }}/{{ .Cluster.InfrastructureAccountID }}/{{ .Cluster.Alias }}/"
          force_path: true
          region: "{{ .Cluster.ConfigItems.skipper_open_policy_agent_decision_log_s3_region }}"
          batching:
            compress: true
            at_bytes: 1048576
            at_period: 10s
{{- end }}
{{- end }}
