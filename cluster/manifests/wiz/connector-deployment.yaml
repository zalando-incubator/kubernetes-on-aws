{{ if eq .Cluster.ConfigItems.wiz_enable_runtime_connector_broker "true"}}
---
# Source: wiz-kubernetes-integration/charts/wiz-kubernetes-connector/charts/wiz-broker/templates/wiz-broker-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiz-connector-agent
  namespace: "wiz"
  labels:
    helm.sh/chart: wiz-broker-2.3.8
    application: "wiz"
    component: "connector"
    deployment: "wiz-connector-agent"
spec:
  replicas: 1
  selector:
    matchLabels:
      deployment: "wiz-connector-agent"
  template:
    metadata:
      labels:
        helm.sh/chart: wiz-broker-2.3.8
        application: "wiz"
        component: "connector"
        deployment: "wiz-connector-agent"
    spec:
      serviceAccountName: wiz-broker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      volumes:
        - name: api-client
          secret:
            secretName: wiz-api-token
        - name: connector-data
          secret:
            secretName: wiz-connector-connector
            items:
              - key: connectorData
                path: data
      containers:
        - name: wiz-broker
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
          image: "container-registry.zalando.net/secops-systems/wiz-broker:2.7-main-4"
          imagePullPolicy: IfNotPresent
          volumeMounts:
          - name: api-client
            mountPath: /var/api-client
            readOnly: true
          - name: connector-data
            mountPath: /etc/connectorData
            readOnly: true
          args:
            - /etc/connectorData/data
          env:
          - name: LOG_LEVEL
            value: info
          - name: WIZ_ENV
            value: 
          - name: CLI_FILES_AS_ARGS
            value: "/var/api-client/clientToken,/var/api-client/clientId"
          - name: TARGET_IP
            value: kubernetes.default.svc.cluster.local
          - name: TARGET_PORT
            value: "443"
          resources:
            limits:
              cpu: {{ .Cluster.ConfigItems.wiz_connector_cpu }} 
              memory: {{ .Cluster.ConfigItems.wiz_connector_memory }} 
            requests:
              cpu: {{ .Cluster.ConfigItems.wiz_connector_cpu }}
              memory: {{ .Cluster.ConfigItems.wiz_connector_memory }} 
{{end}}
