{{ if eq .Cluster.ConfigItems.wiz_enable_runtime_connector "true"}}
---
# Source: wiz-kubernetes-integration/charts/wiz-kubernetes-connector/templates/job-create-connector.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: wiz-kubernetes-connector-create-connector
  namespace: "wiz"
  labels:
    application: "wiz"
    component: "connector"
    version: "2.9"
    job: "wiz-connector-agent"
spec:
  ttlSecondsAfterFinished: 60
  manualSelector: true
  selector:
    matchLabels:
      job: "wiz-connector-agent"
  backoffLimit: 1
  template:
    metadata:
      labels: 
        application: "wiz"
        component: "connector"
        version: "2.9"
        job: "wiz-connector-agent"
    spec:
      serviceAccountName: wiz-auto-modify-connector
      restartPolicy: "Never"
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
      volumes:
      - name: api-client
        secret:
          secretName: wiz-api-token
      containers:
        - name: wiz-connector-creator
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 10000
            runAsNonRoot: true
            runAsUser: 10000
          image: "container-registry.zalando.net/secops-systems/wiz-broker:2.9.1-main-6"
          imagePullPolicy: IfNotPresent
          command:
            - "wiz-broker"
          args:
            - create-kubernetes-connector
            - --api-server-endpoint
            - "https://kubernetes.default.svc.cluster.local"
            - --secrets-namespace
            - "wiz"
            - --service-account-token-secret-name
            - "wiz-cluster-reader-token"
            - --output-secret-name
            - "wiz-connector-connector"
            - --is-on-prem=true
            - --service-type
            - "Kubernetes"
            - --wait=true
            - --connector-name
            - {{.Cluster.Alias}}
          env:
          - name: CLI_FILES_AS_ARGS
            value: "/var/api-client/clientToken,/var/api-client/clientId"
          - name: LOG_LEVEL
            value: info
          - name: WIZ_ENV
            value: 
          resources:
            limits:
              cpu: {{ .Cluster.ConfigItems.wiz_connector_cpu }} 
              memory: {{ .Cluster.ConfigItems.wiz_connector_memory }} 
            requests:
              cpu: {{ .Cluster.ConfigItems.wiz_connector_cpu }}
              memory: {{ .Cluster.ConfigItems.wiz_connector_memory }}
          volumeMounts:
          - name: api-client
            mountPath: /var/api-client
            readOnly: true
{{end}}
