kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: cdp-deployer-poweruser-secret-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: poweruser-secret-read
subjects:
- kind: ServiceAccount
  name: cdp
  namespace: default
# {{ end }}
