{{- if eq .Cluster.ConfigItems.kubernetes_mcp_enabled "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubernetes-mcp
  labels:
    application: kubernetes
    component: mcp
rules:
  # Permit arbitrary usernames for audit identity, but only the read-only groups.
  # The constraints below still limit impersonated requests to the explicit
  # read-only resource/action allow-list.
  - apiGroups: ["authentication.k8s.io"]
    resources: ["users"]
    verbs: ["impersonate:user-info"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["groups"]
    verbs: ["impersonate:user-info"]
    resourceNames: ["okta:common/read-only", "zalando:readonly"]
  # Constrained impersonation separately authorizes the requested read action
  # while acting as the impersonated user. Keep this to discovery and read-only
  # API verbs since this MCP exposes no write operations.
  - nonResourceURLs:
    - "/version"
    - "/api"
    - "/api/*"
    - "/apis"
    - "/apis/*"
    - "/openapi"
    - "/openapi/*"
    verbs: ["impersonate-on:user-info:get"]
  - apiGroups: ["*"]
    resources: ["*"]
    verbs:
    - "impersonate-on:user-info:get"
    - "impersonate-on:user-info:list"
    - "impersonate-on:user-info:watch"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-mcp
  labels:
    application: kubernetes
    component: mcp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubernetes-mcp
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: zalando-iam:zalando:service:stups_kubernetes-mcp
{{- end }}
