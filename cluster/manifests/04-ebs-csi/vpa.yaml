apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: ebs-csi-controller
  namespace: kube-system
  labels:
    application: kubernetes
    component: ebs-csi-driver
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ebs-csi-controller
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
    - containerName: ebs-plugin
      minAllowed:
        cpu: {{ .Cluster.ConfigItems.ebs_csi_plugin_cpu }}
        memory: {{ .Cluster.ConfigItems.ebs_csi_plugin_memory }}
    - containerName: liveness-probe
      minAllowed:
        cpu: {{ .Cluster.ConfigItems.ebs_csi_liveness_cpu }}
        memory: {{ .Cluster.ConfigItems.ebs_csi_liveness_memory }}
    - containerName: csi-provisioner
      minAllowed:
        cpu: {{ .Cluster.ConfigItems.ebs_csi_controller_sidecar_cpu }}
        memory: {{ .Cluster.ConfigItems.ebs_csi_controller_sidecar_memory }}
    - containerName: csi-attacher
      minAllowed:
        cpu: {{ .Cluster.ConfigItems.ebs_csi_controller_sidecar_cpu }}
        memory: {{ .Cluster.ConfigItems.ebs_csi_controller_sidecar_memory }}
    - containerName: csi-resizer
      minAllowed:
        cpu: {{ .Cluster.ConfigItems.ebs_csi_controller_sidecar_cpu }}
        memory: {{ .Cluster.ConfigItems.ebs_csi_controller_sidecar_memory }}
