{{- if or (eq .Cluster.Provider "zalando-aws") (eq .Cluster.Provider "zalando-eks") }}
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: ebs.csi.aws.com
  labels:
    application: kubernetes
    component: ebs-csi-driver
spec:
  attachRequired: true
  podInfoOnMount: false
  fsGroupPolicy: File
{{- end }}
