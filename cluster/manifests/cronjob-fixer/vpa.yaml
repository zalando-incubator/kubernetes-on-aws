{{- if or (eq .Cluster.Provider "zalando-aws") (eq .Cluster.Provider "zalando-eks") }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: cronjob-fixer
  namespace: kube-system
  labels:
    application: kubernetes
    component: cronjob-fixer
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cronjob-fixer
  updatePolicy:
    updateMode: InPlaceOrRecreate
  resourcePolicy:
    containerPolicies:
    - containerName: cronjob-fixer
      maxAllowed:
        memory: 4Gi
{{- end }}
