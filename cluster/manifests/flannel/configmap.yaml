{{- if or (eq .Cluster.Provider "zalando-aws") (eq .Cluster.Provider "zalando-eks") }}
kind: ConfigMap
apiVersion: v1
metadata:
  name: kube-flannel-cfg
  namespace: kube-system
  labels:
    application: kubernetes
    component: flannel
data:
  net-conf.json: |
    {
      "Network": "10.2.0.0/15",
      "Backend": {
        "Type": "vxlan"
      }
    }
{{- end }}
