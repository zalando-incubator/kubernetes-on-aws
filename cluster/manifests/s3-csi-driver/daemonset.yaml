{{- if eq .Cluster.ConfigItems.s3_csi_driver "true" }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    application: kubernetes
    component: aws-mountpoint-s3-csi-driver
    app.kubernetes.io/name: aws-mountpoint-s3-csi-driver
  name: s3-csi-node
  namespace: kube-system
spec:
  selector:
    matchLabels:
      daemonset: s3-csi-node
  template:
    metadata:
      labels:
        daemonset: s3-csi-node
        application: kubernetes
        component: aws-mountpoint-s3-csi-driver
    spec:
      nodeSelector:
        kubernetes.io/os: linux
        node.kubernetes.io/role: worker
      serviceAccountName: s3-csi-driver-sa
      priorityClassName: system-node-critical
{{- if eq .Cluster.ConfigItems.s3_csi_driver_node_selector_restricted "true" }}
        s3-csi-driver: enabled
{{- end }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: eks.amazonaws.com/compute-type
                    operator: NotIn
                    values:
                      - fargate
                      - hybrid
      tolerations:
        - operator: Exists
      containers:
        - name: s3-plugin
          # image: container-registry.zalando.net/teapot/aws-mountpoint-s3-csi-driver:v2.0.0-master-32
          image: mikkeloscar/s3-csi-driver:v2.4.0
          securityContext:
            privileged: true
            seLinuxOptions:
              user: system_u
              type: super_t
              role: system_r
              level: s0
          imagePullPolicy: IfNotPresent
          args:
            - --endpoint=$(CSI_ENDPOINT)
            - --v=4
          env:
            - name: CSI_ENDPOINT
              value: unix:/var/lib/kubelet/plugins/s3.csi.aws.com/csi.sock
            - name: KUBELET_PATH
              value: /var/lib/kubelet
            - name: CSI_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: HOST_PLUGIN_DIR
              value: /var/lib/kubelet/plugins/s3.csi.aws.com/
            - name: SUPPORT_LEGACY_SYSTEMD_MOUNTS
              value: "true"
            - name: MOUNTPOINT_NAMESPACE
              value: mount-s3
            # - name: EKS_POD_IDENTITY_AGENT_CONTAINER_CREDENTIALS_FULL_URI
            #   value: http://169.254.170.23/v1/credentials
            - name: AWS_DEFAULT_REGION
              value: "{{ .Cluster.Region }}"
          volumeMounts:
            - name: kubelet-dir
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
          ports:
            - name: healthz
              containerPort: 9808
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 10
            timeoutSeconds: 3
            periodSeconds: 2
            failureThreshold: 5
          resources:
            limits:
              cpu: 1m
              memory: 40Mi
            requests:
              cpu: 1m
              memory: 40Mi
              ephemeral-storage: 256Mi
        - name: node-driver-registrar
          image: container-registry.zalando.net/teapot/node-driver-registrar:v2.13.0-eks-1-33-9-master-32
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          args:
            - --csi-address=$(ADDRESS)
            - --kubelet-registration-path=$(DRIVER_REG_SOCK_PATH)
          env:
            - name: ADDRESS
              value: /csi/csi.sock
            - name: DRIVER_REG_SOCK_PATH
              value: /var/lib/kubelet/plugins/s3.csi.aws.com/csi.sock
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          livenessProbe:
            exec:
              command:
                - /csi-node-driver-registrar
                - --kubelet-registration-path=$(DRIVER_REG_SOCK_PATH)
                - --mode=kubelet-registration-probe
            initialDelaySeconds: 30
            timeoutSeconds: 15
            periodSeconds: 90
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
          resources:
            limits:
              cpu: 1m
              memory: 40Mi
            requests:
              cpu: 1m
              memory: 40Mi
              ephemeral-storage: 256Mi
        - name: liveness-probe
          image: container-registry.zalando.net/teapot/livenessprobe:v2.15.0-eks-1-33-9-master-32
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          args:
            - --csi-address=/csi/csi.sock
          volumeMounts:
            - name: plugin-dir
              mountPath: /csi
          resources:
            limits:
              cpu: 1m
              memory: 40Mi
            requests:
              cpu: 1m
              memory: 40Mi
              ephemeral-storage: 256Mi
      volumes:
        - name: kubelet-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: plugin-dir
          hostPath:
            path: /var/lib/kubelet/plugins/s3.csi.aws.com/
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry/
            type: Directory
{{- end }}
