apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-static-egress-controller
  namespace: kube-system
  labels:
    application: kubernetes
    component: kube-static-egress-controller
spec:
  replicas: {{if eq .Cluster.ConfigItems.static_egress_controller_enabled "true"}}1{{else}}0{{end}}
  selector:
    matchLabels:
      deployment: kube-static-egress-controller
  template:
    metadata:
      labels:
        deployment: kube-static-egress-controller
        application: kubernetes
        component: kube-static-egress-controller
      annotations:
        logging/destination: "{{.Cluster.ConfigItems.log_destination_both}}"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      serviceAccountName: kube-static-egress-controller
      containers:
      - name: controller
        image: container-registry.zalando.net/teapot/kube-static-egress-controller:v0.4.0-master-56
        args:
        - "--master={{ .Cluster.LocalID }}.{{ .Values.hosted_zone }}"
        - "--provider=aws"
        - "--vpc-id={{.Cluster.ConfigItems.vpc_id}}"
        - "--cf-template-bucket=cluster-lifecycle-manager-{{.Cluster.InfrastructureAccountID}}-{{.Cluster.Region}}"
{{- if index .Cluster.ConfigItems "static_egress_cidr_nat_subnets"}}
{{- range $subnet := split .Cluster.ConfigItems.static_egress_cidr_nat_subnets ","}}
        - "--aws-nat-cidr-block={{ $subnet }}"
{{- end }}
{{- else}}
{{- range $subnet := stupsNATSubnets .Values.vpc_ipv4_cidr }}
        - "--aws-nat-cidr-block={{ $subnet }}"
{{- end }}
{{- end }}
{{ range $zone := .Values.availability_zones }}
        - "--aws-az={{ $zone }}"
{{ end }}
        - "--stack-termination-protection"
        - "--cluster-id={{ .Cluster.ID }}"
        - "--cluster-id-tag-prefix=zalando.org/cluster/"
        - "--additional-stack-tags=InfrastructureComponent=true"
        - "--additional-stack-tags=application=kubernetes"
        - "--additional-stack-tags=component=kube-static-egress-controller"
        - "--use-platform-credentials"
        env:
        - name: AWS_REGION
          value: {{ .Cluster.Region }}
        resources:
          limits:
            cpu: 5m
            memory: 50Mi
          requests:
            cpu: 5m
            memory: 50Mi
        ports:
          - containerPort: 8000
            protocol: TCP
        volumeMounts:
        - name: platform-iam-credentials
          mountPath: /meta/credentials
          readOnly: true
      volumes:
      - name: platform-iam-credentials
        secret:
          secretName: kube-static-egress-controller-credentials
