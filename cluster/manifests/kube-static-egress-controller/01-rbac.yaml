apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-static-egress-controller
  namespace: kube-system
  annotations:
    iam.amazonaws.com/role: "{{ .Cluster.LocalID }}-static-egress-controller"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-static-egress-controller
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-static-egress-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-static-egress-controller
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: zalando-iam:zalando:service:stups_kubernetes
---
apiVersion: zalando.org/v1
kind: PlatformCredentialsSet
metadata:
  name: kube-static-egress-controller-credentials
  namespace: kube-system
spec:
  application: kubernetes
  token_version: v2
  tokens:
    kube-static-egress-controller:
      privileges: []
