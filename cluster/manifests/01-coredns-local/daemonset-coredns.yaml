apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: coredns
  namespace: kube-system
  labels:
    application: kubernetes
    component: coredns
spec:
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      daemonset: coredns
  template:
    metadata:
      labels:
        daemonset: coredns
        application: kubernetes
        component: coredns
        instance: node-dns
      annotations:
        logging/destination: "{{.Cluster.ConfigItems.log_destination_infra}}"
        prometheus.io/path: /metrics
        prometheus.io/scrape: "true"
        prometheus.io/port: "9153"
        dns-static-interface: "{{.Cluster.ConfigItems.dns_static_interface}}"
    spec:
      resources:
        limits:
          cpu: {{.Cluster.ConfigItems.dns_coredns_cpu}}
          memory: {{.Cluster.ConfigItems.dns_coredns_mem}}
      terminationGracePeriodSeconds: 40
      initContainers:
      - name: ensure-apiserver
        image: 926694233939.dkr.ecr.eu-central-1.amazonaws.com/production_namespace/teapot/ensure-apiserver:master-6
        resources:
          requests:
            ephemeral-storage: 256Mi
{{- if ne .Cluster.ConfigItems.dns_static_interface "" }}
      - name: static-interface
        image: 926694233939.dkr.ecr.eu-central-1.amazonaws.com/production_namespace/cloud-platform/dnscache-interface:main-1
        restartPolicy: Always
        args:
        - --local-ip
{{- if and (eq .Cluster.Provider "zalando-eks") (eq .Cluster.ConfigItems.eks_ip_family "ipv6") }}
        - "fd00:1:2:3::5"
{{- else }}
        - "169.254.20.10"
{{- end }}
        - --local-port
        - "53"
        resources:
          requests:
            ephemeral-storage: 256Mi
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
{{- end }}
      containers:
      - name: unbound
        image: 926694233939.dkr.ecr.eu-central-1.amazonaws.com/production_namespace/teapot/unbound:1.25.1-master-19
        args:
        - -d
        - -c
        - /etc/unbound/unbound.conf
        ports:
        - containerPort: 53
          name: dns-cache-udp
          protocol: UDP
        - containerPort: 53
          name: dns-cache-tcp
          protocol: TCP
{{- if eq .Cluster.ConfigItems.expirimental_dns_unbound_liveness_probe "true" }}
        livenessProbe:
          exec:
            command:
            - dig
            - "+short"
{{- if and (eq .Cluster.Provider "zalando-eks") (eq .Cluster.ConfigItems.eks_ip_family "ipv6") }}
{{- if ne .Cluster.ConfigItems.dns_static_interface "interface" }}
            - "@fd00:1:2:3::5"
{{- else }}
            - "@::1"
{{- end }}
{{- else }}
{{- if ne .Cluster.ConfigItems.dns_static_interface "interface" }}
            - "@169.254.20.10"
{{- else }}
            - "@127.0.0.1"
{{- end }}
{{- end }}
            - "kubernetes.default.svc.cluster.local"
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
{{- end }}
        lifecycle:
          preStop:
            sleep:
              seconds: 35
        resources:
          requests:
            ephemeral-storage: 256Mi
        volumeMounts:
        - mountPath: /etc/unbound/unbound.conf
          name: config-volume
          readOnly: true
          subPath: unbound.conf
        - mountPath: /run/unbound
          name: unbound-socket
          readOnly: false
      - name: unbound-exporter
        image: 926694233939.dkr.ecr.eu-central-1.amazonaws.com/production_namespace/teapot/unbound_exporter:v0.6.0-main-5.custom
        args:
        - -unbound.ca
        - ""
        - -unbound.cert
        - ""
        - -unbound.host
        - "unix:///run/unbound/unbound.ctl"
        - -web.listen-address
        - ":9054"
        ports:
        - name: metrics
          containerPort: 9054
          protocol: TCP
        resources:
          requests:
            ephemeral-storage: 256Mi
        volumeMounts:
        - mountPath: /run/unbound
          name: unbound-socket
          readOnly: false
      - name: coredns
        image: 926694233939.dkr.ecr.eu-central-1.amazonaws.com/production_namespace/teapot/coredns:1.14.6-master-36
        args: [ "-conf", "/etc/coredns/Corefile" ]
        env:
        - name: ZONE
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['topology.kubernetes.io/zone']
        volumeMounts:
        - name: config-volume
          mountPath: /etc/coredns
        ports:
        - containerPort: 9254
          name: dns
          protocol: UDP
        - containerPort: 9254
          name: dns-tcp
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: 9154
            scheme: HTTP
          initialDelaySeconds: 60
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /ready
            port: 9155
            scheme: HTTP
          initialDelaySeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        resources:
          requests:
            ephemeral-storage: 256Mi
        lifecycle:
          preStop:
            sleep:
              seconds: 35
      priorityClassName: system-node-critical
      serviceAccountName: coredns
      hostNetwork: true
      dnsPolicy: Default
      tolerations:
      - key: node.kubernetes.io/role
        value: master
        effect: NoSchedule
      - key: node.kubernetes.io/not-ready
        operator: Exists
      - key: dedicated
        operator: Exists
      - key: "zalando.org/dedicated"
        operator: Exists
      - key: aws.amazon.com/spot
        operator: Exists
      - key: zalando.org/node-not-ready
        operator: Exists
        effect: NoSchedule
      - key: nvidia.com/gpu
        value: present
        effect: NoSchedule
      # these are tolerated in the unlikely case an already scheduled daemonset
      # pod is deleted and needs to be rescheduled on a to be terminated node.
      - key: decommission-pending
        operator: Exists
      - key: karpenter.sh/disruption
        operator: Exists
      - key: DeletionCandidateOfClusterAutoscaler
        operator: Exists
      - key: ToBeDeletedByClusterAutoscaler
        operator: Exists
      - key: BeingDeletedByClusterAutoscaler
        operator: Exists
      volumes:
      - name: config-volume
        configMap:
          name: coredns-local
          items:
          - key: Corefile
            path: Corefile
          - key: unbound.conf
            path: unbound.conf
      - name: unbound-socket
        emptyDir: {}
