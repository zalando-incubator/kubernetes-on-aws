apiVersion: v1
kind: ServiceAccount
metadata:
  name: "deployment-service-controller"
  namespace: "kube-system"
  labels:
    application: "deployment-service"
    component: "controller"
  annotations:
    {{- if eq .Cluster.Provider "zalando-eks" }}
    eks.amazonaws.com/role-arn: "arn:aws:iam::{{.Cluster.InfrastructureAccountID}}:role/{{.Cluster.ConfigItems.deployment_service_controller_role_name}}"
    {{- else }}
    iam.amazonaws.com/role: "{{.Cluster.ConfigItems.deployment_service_controller_role_name}}"
    {{- end }}
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: "deployment-service-controller"
  labels:
    application: "deployment-service"
    component: "controller"
rules:
  - apiGroups:
      - deployment.zalando.org
    resources:
      - cdpdeploymenttasks
      - cdpdeploymenttasks/status
      - cdpresourcecleanuptasks
      - cdpresourcecleanuptasks/status
    verbs:
      - get
      - list
      - watch
      - update
      - patch
      - delete
      - deletecollection
  - apiGroups:
      - ""
      - "events.k8s.io"
    resources:
      - events
    verbs:
      - create
      - patch
      - update
      - get
      - list
      - watch
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: "deployment-service-controller"
  labels:
    application: "deployment-service"
    component: "controller"
subjects:
  - kind: ServiceAccount
    name: "deployment-service-controller"
    namespace: "kube-system"
roleRef:
  kind: ClusterRole
  name: "deployment-service-controller"
  apiGroup: rbac.authorization.k8s.io
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: "deployment-service-executor-crd-access"
  labels:
    application: "deployment-service"
    component: "controller"
rules:
  - apiGroups:
      - "databases.spotahome.com"
    resources:
      - redisfailovers/scale
    verbs:
      - get
      - list
      - watch
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: "deployment-service-executor-crd-access"
