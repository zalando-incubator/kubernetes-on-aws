{{- if eq .Cluster.ConfigItems.capability_kro_enabled "true"}}
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: kro-poweruser
  labels:
    application: kubernetes
    component: kro
roleRef:
  kind: ClusterRole
  name: poweruser
  apiGroup: rbac.authorization.k8s.io
subjects:
- kind: User
  name: "arn:aws:sts::{{.Cluster.InfrastructureAccountID}}:assumed-role/{{.Cluster.Alias}}-KRO-CapabilityRole/KRO"
  apiGroup: rbac.authorization.k8s.io
{{- end }}
