{{- if eq .Cluster.ConfigItems.ec2_resource_dra_enabled "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: ec2-resource-dra-webhook-tls
  namespace: kube-system
  labels:
    application: kubernetes
    component: ec2-resource-dra-webhook
type: kubernetes.io/tls
data:
  tls.crt: "{{ .Cluster.ConfigItems.ec2_resource_dra_webhook_cert }}"
  tls.key: "{{ .Cluster.ConfigItems.ec2_resource_dra_webhook_key }}"
{{- end }}
