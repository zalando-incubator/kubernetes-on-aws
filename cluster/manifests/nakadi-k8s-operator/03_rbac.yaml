apiVersion: v1
kind: ServiceAccount
metadata:
  name: "nakadi-k8s-operator-robot"
  namespace: "nakadi-k8s-operator"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: "nakadi-k8s-operator-role"
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "delete", "list"]
  - apiGroups: ["nakadi.zalan.do"]
    resources: ["eventtypesubscriptions", "eventtypesubscriptions/status", "eventtypes", "eventtypes/status", "nakadisqlqueries", "nakadisqlqueries/status"]
    verbs: ["get", "create", "update", "delete", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: "nakadi-k8s-operator-role-binding"
subjects:
  - kind: ServiceAccount
    name: "nakadi-k8s-operator-robot"
    namespace: "nakadi-k8s-operator"
roleRef:
  kind: ClusterRole
  name: nakadi-k8s-operator-role
  apiGroup: rbac.authorization.k8s.io
