{{- if or (eq .Cluster.Provider "zalando-aws") (eq .Cluster.Provider "zalando-eks") }}
apiVersion: v1
kind: Service
metadata:
  name: skipper-ingress-canary-routesrv
  namespace: kube-system
  labels:
    application: skipper-ingress
    component: routesrv
    kubernetes.io/cluster-service: "true"
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 9990
      protocol: TCP
  selector:
    deployment: skipper-ingress-canary-routesrv
{{- end }}
