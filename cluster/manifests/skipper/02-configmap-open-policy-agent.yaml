{{ if eq .Cluster.ConfigItems.skipper_open_policy_agent_enabled "true" }}
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    application: skipper-ingress
    component: ingress
  name: open-policy-agent-config
  namespace: kube-system
data:
  opaconfig.yaml: |-
    discovery:
      name: discovery
      resource: v1/bundles/zalando-apps/{{ `{{ .bundlename }}` }}/discovery.tgz
      service: styra-bundles
    labels:
      environment: {{ .Cluster.Environment }}
      kubernetes-cluster-alias: {{ .Cluster.Alias }}
      aws-account-id: "{{ .Cluster.InfrastructureAccountID }}"
    services:
    - credentials:
        bearer:
          token: "{{ `{{ .Env.STYRA_TOKEN }}` }}"
      name: styra
      url: "{{ .Cluster.ConfigItems.skipper_open_policy_agent_observability_url }}"
      response_header_timeout_seconds: {{ .Cluster.ConfigItems.skipper_open_policy_agent_styra_response_header_timeout }}
    - credentials:
        s3_signing:
          web_identity_credentials:
            aws_region: {{ .Cluster.Region }}
            session_name: open-policy-agent-instance
      name: styra-bundles
      url: "{{ .Cluster.ConfigItems.skipper_open_policy_agent_bundles_url }}"
    {{ if eq .Cluster.ConfigItems.skipper_open_policy_agent_decision_logs_buffer_type_event_enable "true" }}
    decision_logs:
      reporting:
        buffer_type: "event"
        buffer_size_limit_events: {{ .Cluster.ConfigItems.skipper_open_policy_agent_decision_logs_buffer_type_event_limit }}
    {{ else if eq .Cluster.ConfigItems.skipper_open_policy_agent_decision_log_export_enabled "true" }}
    status:
      prometheus: true
    decision_logs:
      plugin: eopa_dl
    plugins:
      eopa_dl:
        buffer:
          type: memory
          max_bytes: 15728640
          flush_at_bytes: 10485760
          flush_at_period: 15s
        output:
        {{ if eq .Cluster.ConfigItems.skipper_open_policy_agent_console_logs_enabled "true" }}
        - type: console
        {{ end }}
        - type: s3
          bucket: {{ `{{ .bundlename }}` }}
          timeout: "2s"
          endpoint: "{{ .Cluster.ConfigItems.skipper_open_policy_agent_decision_log_s3_endpoint }}/{{ .Cluster.Alias }}/"
          force_path: true
          region: "{{ .Cluster.ConfigItems.skipper_open_policy_agent_decision_log_s3_region }}"
          batching:
            compress: true
            at_bytes: 1048576
            at_period: 10s
    {{ end }}
    {{ if eq .Cluster.ConfigItems.skipper_open_policy_agent_jwt_cache_enable "true" }}
    caching: 
      inter_query_builtin_value_cache:
        named:
          io_jwt:
            max_num_entries: {{ .Cluster.ConfigItems.skipper_open_policy_agent_jwt_cache_max_num_entries }}
    {{ end }}
  envoymetadata.json: |-
    {
      "filter_metadata": {
        "envoy.filters.http.header_to_metadata": {
          "policy_type": "ingress"
        }
      }
    }
{{ end }}
