{{- if or (eq .Cluster.Provider "zalando-aws") (eq .Cluster.Provider "zalando-eks") }}
{{ if eq .Cluster.ConfigItems.skipper_priority_routes_enabled "true" }}
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    application: skipper-ingress
    component: ingress
  name: priority-routes-config
  namespace: kube-system
data:
  routes.eskip: |-
    p0: False() -> <shunt>;
{{ end }}
{{- end }}
