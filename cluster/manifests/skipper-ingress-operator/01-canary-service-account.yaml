# {{ if eq .Cluster.ConfigItems.skipper_ingress_operator_enabled "true" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: skipper-ingress-operator
  namespace: kube-system
  labels:
    application: skipper-ingress
    component: operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: skipper-ingress-operator
  labels:
    application: skipper-ingress
    component: operator
rules:
  - apiGroups:
      - "apps"
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - update
  - apiGroups:
      - "apps"
    resources:
      - controllerrevisions
    verbs:
      - get
      - list
      - delete
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: skipper-ingress-operator
  labels:
    application: skipper-ingress
    component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: skipper-ingress-operator
subjects:
  - kind: ServiceAccount
    name: skipper-ingress-operator
    namespace: kube-system
# {{ end }}
