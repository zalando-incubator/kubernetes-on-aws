{{- if eq .Cluster.ConfigItems.parca_agent_enabled "true" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    application: kubernetes
    component: parca-agent
  name: parca-agent
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    application: kubernetes
    component: parca-agent
  name: parca-agent
  namespace: kube-system
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    application: kubernetes
    component: parca-agent
  name: parca-agent
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: parca-agent
subjects:
  - kind: ServiceAccount
    name: parca-agent
    namespace: kube-system
{{- end }}
