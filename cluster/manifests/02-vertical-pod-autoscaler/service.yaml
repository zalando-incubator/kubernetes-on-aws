{{- if or (eq .Cluster.Provider "zalando-aws") (eq .Cluster.Provider "zalando-eks") }}
apiVersion: v1
kind: Service
metadata:
  name: vpa-webhook
  namespace: kube-system
  labels:
    application: kubernetes
    component: vpa-admission-controller
spec:
  selector:
    application: kubernetes
    component: vpa-admission-controller
  ports:
    - port: 443
      targetPort: 8000
      protocol: TCP
{{- end }}
