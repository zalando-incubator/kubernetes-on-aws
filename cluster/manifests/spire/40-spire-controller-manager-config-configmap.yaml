apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-controller-manager-config
  namespace: spire
data:
  server.conf: |
    apiVersion: spire.spiffe.io/v1alpha1
    kind: ControllerManagerConfig
    metrics:
      bindAddress: 127.0.0.1:8082
    health:
      healthProbeBindAddress: 0.0.0.0:8083
    leaderElection:
      leaderElect: true
      resourceName: 98c9c988.spiffe.io
      resourceNamespace: spire
    clusterName: pg9-euc1-test
    # clusterName: {{ .Cluster.Alias }}
    logLevel: info
    trustDomain: pg9-euc1-test.test.k8s.zalando.com
    # trustDomain: {{ .Cluster.Alias }}.{{ .Cluster.Environment }}.k8s.zalando.com
    ignoreNamespaces:
      - kube-public
      - local-path-storage
      # - kube-system
      # - spire
