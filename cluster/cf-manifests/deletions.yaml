# Everything defined in `pre_apply` be deleted before applying the manifests
# Consider putting as much as possible in `post_apply` to avoid other teams, e.g. Teapot, from being blocked
# by your deletions in case of errors and inconsistency between clusters.
# See https://chat.google.com/room/AAAA1dSbk8M/IOenz9ERA2s/gapDsUignW8?cls=10 for more information.
pre_apply: []

# Everything defined in `post_apply` will be deleted after applying the manifests
# Example:
# post_apply:
# - my-cf-stack-1
# - my-cf-stack-2
post_apply: []
  # - "zalando-testing-deletions"
