- id: deploy-event
  type: deploy
  # HACK: merging user should be able to deploy to the target and
  # target should not have "-test" suffix ¯\_(ツ)_/¯
  target: teapot
  when:
    event: push
    branch:
    - dev
    - alpha
    - beta
    - stable
  sources:
  - dir: _deploy_event
