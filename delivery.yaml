version: "2017-09-20"
allow_concurrent_steps: true
pipeline:
- id: build
  depends_on: []
  when:
  - branch: dev
  - branch: alpha
  - branch: beta
  - branch: stable
  - event: pull_request
  vm_config:
    type: linux
    image: "cdp-runtime/go-1.23"
    size: large  # speed up building kubernetes/kubernetes
  cache:
    paths:
    - /go/pkg/mod        # pkg cache for Go modules
    - ~/.cache/go-build  # Go build cache
  type: script
  commands:
  - desc: install deps
    cmd: |
      apt-get update -qq && apt-get install -qq rsync
  - desc: build and push
    cmd: |
      cd ./test/e2e/
      make
      go mod tidy
      if ! git diff --quiet go.mod go.sum; then
        echo "Running go mod tidy modified go.mod and/or go.sum"
        exit 1
      fi

      IMAGE=container-registry-test.zalando.net/teapot/kubernetes-on-aws-e2e
      IMAGE=$IMAGE VERSION=$CDP_BUILD_VERSION make build.push.multiarch

- id: create-cluster-aws
  when:
    event: pull_request
  depends_on:
  - build
  type: process
  desc: "Create cluster for Kubernetes e2e tests"
  target: stups-test
  process: microservice_standard_test
  config:
    apply_manifests:
      env: &apply_env
      - name: DEPLOYMENT_PATH
        value: test/e2e
      - name: IAM_ROLE_ARN
        value: "arn:aws:iam::925511348110:role/cluster-lifecycle-manager-entrypoint"
      - name: APPLICATION
        value: kubernetes
      - name: COMPONENT
        value: e2e
    end2end_tests:
      metadata:
        name: e2e
        labels:
          application: kubernetes
          component: e2e
        annotations:
          zalando.org/runtime-policy: require-on-demand
      spec:
        serviceAccountName: kubernetes-e2e
        restartPolicy: Never
        containers:
        - name: e2e
          image: "container-registry-test.zalando.net/teapot/kubernetes-on-aws-e2e:#{CDP_BUILD_VERSION}"
          args:
          - create-cluster
          env: &e2e_env
          - name: CLUSTER_ADMIN_TOKEN
            valueFrom:
              secretKeyRef:
                name: kubernetes-e2e-credentials
                key: "cluster-token-secret"
          envFrom: &e2e_env_from_aws
          - configMapRef:
              name: kubernetes-e2e-config-provider-aws
          - configMapRef:
              name: kubernetes-e2e-config
          - secretRef:
              name: kubernetes-e2e-config-secret
          resources:
            limits:
              cpu: 500m
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 2Gi

- id: e2e-tests-aws
  when:
    event: pull_request
  depends_on:
  - create-cluster-aws
  type: process
  desc: "Kubernetes e2e tests"
  target: stups-test
  process: microservice_standard_test
  config:
    apply_manifests:
      env: *apply_env
    end2end_tests:
      metadata:
        name: e2e
        labels:
          application: kubernetes
          component: e2e
        annotations:
          zalando.org/runtime-policy: require-on-demand
      spec:
        serviceAccountName: kubernetes-e2e
        restartPolicy: Never
        containers:
        - name: e2e
          image: "container-registry-test.zalando.net/teapot/kubernetes-on-aws-e2e:#{CDP_BUILD_VERSION}"
          args:
          - e2e
          env: *e2e_env
          envFrom: *e2e_env_from_aws
          resources:
            limits:
              cpu: 2
              memory: 8Gi
            requests:
              cpu: 2
              memory: 8Gi

- id: e2e-load-test-result-aws
  when:
    event: pull_request
  depends_on:
  - create-cluster-aws
  type: process
  desc: "Kubernetes e2e load tests"
  target: stups-test
  process: microservice_standard_test
  config:
    apply_manifests:
      env: *apply_env
    end2end_tests:
      metadata:
        name: e2e
        labels:
          application: kubernetes
          component: e2e
        annotations:
          zalando.org/runtime-policy: require-on-demand
      spec:
        serviceAccountName: kubernetes-e2e
        restartPolicy: Never
        containers:
        - name: e2e
          image: "container-registry-test.zalando.net/teapot/kubernetes-on-aws-e2e:#{CDP_BUILD_VERSION}"
          args:
          - loadtest-e2e
          env: *e2e_env
          envFrom: *e2e_env_from_aws
          resources:
            limits:
              cpu: 1000m
              memory: 1000Mi
            requests:
              cpu: 1000m
              memory: 1000Mi

- id: stackset-e2e-tests-aws
  when:
    event: pull_request
  depends_on:
  - create-cluster-aws
  type: process
  desc: "StackSet e2e tests"
  target: stups-test
  process: microservice_standard_test
  config:
    apply_manifests:
      env: *apply_env
    end2end_tests:
      metadata:
        name: e2e
        labels:
          application: kubernetes
          component: e2e
        annotations:
          zalando.org/runtime-policy: require-on-demand
      spec:
        serviceAccountName: kubernetes-e2e
        restartPolicy: Never
        containers:
        - name: e2e
          image: "container-registry-test.zalando.net/teapot/kubernetes-on-aws-e2e:#{CDP_BUILD_VERSION}"
          args:
          - stackset-e2e
          env: *e2e_env
          envFrom: *e2e_env_from_aws
          resources:
            limits:
              cpu: 2
              memory: 1Gi
            requests:
              cpu: 2
              memory: 1Gi

- id: decommission-cluster-aws
  when:
    event: pull_request
  depends_on:
  - e2e-tests-aws
  - stackset-e2e-tests-aws
  - e2e-load-test-result-aws
  type: process
  desc: "Decommission cluster used for Kubernetes e2e tests"
  target: stups-test
  process: microservice_standard_test
  config:
    apply_manifests:
      env: *apply_env
    end2end_tests:
      metadata:
        name: e2e
        labels:
          application: kubernetes
          component: e2e
        annotations:
          zalando.org/runtime-policy: require-on-demand
      spec:
        serviceAccountName: kubernetes-e2e
        restartPolicy: Never
        containers:
        - name: e2e
          image: "container-registry-test.zalando.net/teapot/kubernetes-on-aws-e2e:#{CDP_BUILD_VERSION}"
          args:
          - decommission-cluster
          env: *e2e_env
          envFrom: *e2e_env_from_aws
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 500m
              memory: 1Gi

